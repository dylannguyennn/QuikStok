<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/transitions.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body style="background-color: #212121;">
    <div class="search-container" id="main-container">
    <div class="search-box">
        <form id="searchForm" class="search-form">
            <div class="input-group">
                <input type="text" class="search-input" name="ticker" id="stock_ticker_input" placeholder="Enter stock ticker..." required>
                <div class="button-group">
                    <button type="button" class="icon-btn" id="analyze_stock_btn" title="Analyze">
                        <i class="fas fa-chart-line"></i>
                    </button>
                    <button type="button" class="icon-btn" id="info_stock_btn" title="Get Info">
                        <i class="fas fa-info-circle"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>
    
    <script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
    <script src="{{ url_for('static', filename='js/events.js') }}"></script>
</body>
</html>
