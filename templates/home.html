<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/transitions.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="search-container" id="main-container">
    <div class="search-box">
        <form action="/info" method="POST" id="searchForm" onsubmit="startTransition(event)">
            <input type="text" class="search-input" name="ticker" placeholder="Enter stock ticker..." required>
            <button type="submit" formaction="/analyze" class="icon-btn" title="Analyze">
                <i class="fas fa-chart-line"></i>
            </button>
            <button type="submit" formaction="/info" class="icon-btn" title="Get Info">
                <i class="fas fa-info-circle"></i>
            </button>
        </form>
    </div>
    </div>
    <script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
</body>
</html>
