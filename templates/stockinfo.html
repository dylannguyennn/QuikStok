<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} ({{ symbol }}) - Stock Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/transitions.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .stock-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            color: #ececec;
        }
        .stock-header {
            margin-bottom: 30px;
            color: #ececec;
        }
        .stock-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .metric-card {
            padding: 20px;
            border-radius: 10px;
            background: #171717;
            text-align: center;
        }
        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 0;
            color: #ececec;
        }
        .metric-label {
            color: #ececec;
        }
        .back-btn {
            margin-top: 30px;
        }
    </style>
</head>
<body style="background-color: #212121;">
    <div class="stock-container fade-in">
        <div class="stock-header fade-in">
            <h1>{{ name }} <small color="#ececec">({{ symbol }})</small></h1>
            <h2 class="text-primary">${{ price }}</h2>
        </div>

        <div class="stock-metrics fade-in">
            <div class="metric-card">
                <div class="metric-label">Price</div>
                <div class="metric-value">${{ "{:,.2f}".format(price) if price != 'N/A' else 'N/A' }}</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">P/E Ratio</div>
                <div class="metric-value">{{ pe_ratio }}</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Dividend Yield</div>
                <div class="metric-value">
                    {% if dividend_yield != 'N/A' %}
                        {{ "{:.2f}%".format(dividend_yield) }}
                    {% else %}
                        N/A
                    {% endif %}
                </div>
            </div>
        </div>

        <div class="stock-summary fade-in">
            <h3>Company Summary</h3>
            <p>{{ summary }}</p>
        </div>

        <a href="/" class="fa-solid fa-left-long fa-xl" style="text-decoration: none;"></a>
    </div>
    <script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
</body>
</html>
