<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/transitions.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<style>
    .test {
        color: white;
    }
</style>
<body style="background-color: #212121;">
    <h1 class="test">{{ symbol }} Posts Retrieved:</h1>

    <table class="test">
        <thead>
            <tr>
                <th>Date</th>
                <th>Post</th>
                <th>Label</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            {% for row in sentiment_rows %}
                <tr>
                    <td>{{ row.post_date.strftime('%Y‑%m‑%d %H:%M') }}</td>
                    <td>{{ row.title }}</td>
                    <td>{{ row.label }}</td>
                    <td>{{ '%.3f'|format(row.score) }}</td>
                </tr>
            {% else %}
                <tr>
                  <td colspan="4">No posts to display.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
